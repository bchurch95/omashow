<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #slide-canvas {
      position: absolute;
      inset: 0;
      background: #fff;
      transition: background 0.15s ease;
    }
    #slide-canvas.blackout { background: #000; }
    #slide-canvas.blackout .slide-shape,
    #slide-canvas.blackout .slide-pic { visibility: hidden; }
  </style>
</head>
<body>
  <div id="slide-canvas"></div>
  <script src="slide_render.js"></script>
  <script src="audience.js"></script>
</body>
</html>
