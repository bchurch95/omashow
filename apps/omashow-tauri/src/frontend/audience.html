<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #slide-canvas {
      position: absolute;
      inset: 0;
      background: #fff;
      transition: background 0.15s ease;
    }
    #slide-canvas.blackout { background: #000; }
    .slide-shape {
      position: absolute;
      overflow: hidden;
      padding: 2px 4px;
      line-height: 1.2;
      white-space: pre-wrap;
      word-break: break-word;
      color: #1f2430;
      font-family: system-ui, sans-serif;
      box-sizing: border-box;
    }
    .slide-pic {
      position: absolute;
      overflow: hidden;
    }
    #slide-canvas.blackout .slide-shape,
    #slide-canvas.blackout .slide-pic { visibility: hidden; }
    .slide-pic img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
    }
  </style>
</head>
<body>
  <div id="slide-canvas"></div>
  <script src="slide_render.js"></script>
  <script src="audience.js"></script>
</body>
</html>
