<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Omashow</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; display: flex; height: 100vh; }
    #sidebar { width: 240px; background: #111; color: #eee; padding: 16px; }
    #main { flex: 1; padding: 24px; }
    button { padding: 8px 12px; margin: 4px; }
  </style>
</head>
<body>
  <div id="sidebar">
    <h2>Omashow</h2>
    <button id="new">New</button>
    <button id="open">Open...</button>
    <button id="save">Save...</button>
    <div id="slides"></div>
  </div>
  <div id="main">
    <h1>Welcome to Omashow</h1>
    <p>Rust PowerPoint clone. Use the sidebar to open a .pptx.</p>
    <pre id="log"></pre>
  </div>
  <script src="main.js"></script>
</body>
</html>
