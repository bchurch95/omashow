<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Omashow</title>
  <style>
    :root {
      --bg: #0f1117;
      --panel: #161a23;
      --panel-2: #1c2130;
      --border: #262d3d;
      --text: #d8dee9;
      --dim: #7b849a;
      --accent: #7aa2f7;
      --accent-2: #bb9af7;
      --danger: #f7768e;
      --green: #9ece6a;
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      user-select: none;
    }
    /* ---------- top bar ---------- */
    #topbar {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      transition: opacity 0.25s;
    }
    .brand { margin: 0; font-size: 15px; white-space: nowrap; }
    #doc-title {
      font-size: 13px;
      font-weight: 500;
      color: #aeb7c9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 240px;
      border-left: 1px solid var(--border);
      padding-left: 14px;
      margin-left: 2px;
    }
    #doc-state { font-size: 11px; color: var(--green); white-space: nowrap; }
    #doc-state.edited { color: #f0b429; }
    #doc-state:empty { display: none; }
    #btn-present { margin-left: auto; gap: 6px; font-weight: 600; }
    #btn-laser.on { color: #ff453a; }
    #btn-pen.on { color: #7aa2f7; }
    #btn-marker.on { color: #ffd60a; }
    #ink-overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      pointer-events: none;
      display: none;
    }
    body.presenting #ink-overlay { display: block; }
    #ink-overlay.drawing { cursor: crosshair; }
    #content { flex: 1; display: flex; min-height: 0; }
    /* ---------- sidebar ---------- */
    #sidebar {
      width: 232px;
      min-width: 232px;
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 14px;
      gap: 10px;
    }
    h2 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: 0.5px; color: var(--text); }
    .toolbar { display: flex; flex-wrap: wrap; gap: 6px; }
    button {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #222a41;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 12px;
      font-size: 13px;
      color: #e2e8f2;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, color 0.15s;
    }
    button svg { width: 13px; height: 13px; flex-shrink: 0; }
    button.icon-btn { padding: 7px 9px; }
    button:disabled { opacity: 0.35; cursor: default; pointer-events: none; }
    .divider { width: 1px; align-self: stretch; background: var(--border); margin: 0 3px; }
    button:hover { border-color: var(--accent); background: #2a3247; color: #fff; }
    button:active { background: #232a3c; transform: translateY(1px); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #0f1117; font-weight: 600; }
    button.primary:hover { background: #8fb0ff; }
    button.danger-ghost { color: var(--danger); }
    button.danger-ghost:hover { border-color: var(--danger); }
    #sidebar { position: relative; }
    #sidebar::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 26px;
      background: linear-gradient(transparent, var(--panel));
      pointer-events: none;
    }
    #slides {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 4px;
      scrollbar-width: thin;
      scrollbar-color: #2a3040 transparent;
    }
    .slide-item {
      display: flex;
      flex-direction: column;
      background: #232b3e;
      border: 1px solid #2f3950;
      border-radius: 8px;
      padding: 5px;
      cursor: pointer;
      transition: border-color 0.12s, background 0.12s;
    }
    .slide-item:hover { border-color: #3a445c; background: #20263a; }
    .slide-item.active { border-color: var(--accent); background: #202940; }
    .slide-item.dragging { opacity: 0.4; }
    .slide-item.drag-over { border-color: var(--accent-2); background: #252c4d; }
    .slide-thumb {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #fff;
      border-radius: 5px;
      overflow: hidden;
      transition: box-shadow 0.12s;
    }
    .slide-item.active .slide-thumb { box-shadow: 0 0 0 2px var(--accent); }
    .slide-cap { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
    .slide-idx {
      flex-shrink: 0;
      font-size: 11.5px;
      font-weight: 700;
      color: #9aa3b8;
      line-height: 1.5;
      font-variant-numeric: tabular-nums;
    }
    .slide-item.active .slide-idx { color: var(--accent); }
    .slide-title {
      flex: 1;
      min-width: 0;
      background: rgba(15,17,23,0.35);
      border: 1px solid var(--border);
      outline: none;
      color: #f0f3f8;
      font-weight: 500;
      font-size: 13px;
      padding: 3px 6px;
      border-radius: 4px;
    }
    .slide-title:focus { background: #0f1117; box-shadow: 0 0 0 1px var(--accent); }
    .slide-item.active .slide-title { background: rgba(122,162,247,0.14); color: #fff; }
    .slide-title::placeholder { color: var(--dim); }
    .slide-del {
      position: absolute;
      top: 3px;
      right: 3px;
      z-index: 2;
      visibility: hidden;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.92);
      color: var(--dim);
      font-size: 12px;
      border-radius: 4px;
      padding: 0 5px;
      line-height: 1.5;
      cursor: pointer;
    }
    .slide-item:hover .slide-del { visibility: visible; }
    .slide-del:hover { color: var(--danger); border-color: var(--danger); }
    /* ---------- main ---------- */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #preview-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
      min-height: 0;
      background: radial-gradient(1100px 640px at 50% 44%, #202942 0%, #10131a 72%);
    }
    /* ---------- presenter console (visible while presenting) ---------- */
    #console-side {
      display: none;
      width: 340px;
      flex-direction: column;
      gap: 14px;
      padding: 18px 20px;
      border-left: 1px solid var(--border);
      background: var(--panel);
      overflow: hidden;
    }
    #console-side h3 {
      margin: 0 0 8px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #d0d8e6;
    }
    #next-thumb {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }
    #next-label {
      margin-top: 6px;
      font-size: 12px;
      color: #9aa3b8;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .notes-block { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    #console-notes {
      flex: 1;
      min-height: 40px;
      overflow-y: auto;
      font-size: 14px;
      line-height: 1.55;
      color: #c6cedd;
      white-space: pre-wrap;
      word-break: break-word;
    }
    #console-tools {
      display: flex;
      justify-content: center;
      gap: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    #console-tools .icon-btn:disabled { opacity: 0.35; pointer-events: none; }
    #console-timer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      font-variant-numeric: tabular-nums;
    }
    #timer-elapsed { font-size: 20px; font-weight: 650; color: #edf1f7; }
    #timer-clock { font-size: 13px; color: #9aa3b8; }
    #btn-end-show {
      background: rgba(247, 118, 142, 0.15);
      border: 1px solid rgba(247, 118, 142, 0.35);
      color: #f7768e;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    #btn-end-show:hover {
      background: #f7768e;
      color: #0f1117;
    }
    #slide-canvas {
      width: 100%;
      aspect-ratio: 16 / 9;
      max-width: 100%;
      max-height: 100%;
      background: #fff;
      border: 1px solid #3d465c;
      border-radius: 10px;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.16),
        0 0 0 6px rgba(16,19,26,0.55),
        0 30px 80px rgba(0,0,0,0.65),
        0 8px 30px rgba(0,0,0,0.50),
        0 6px 28px rgba(122,162,247,0.10);
      position: relative;
      overflow: hidden;
    }
    #slide-stage { position: absolute; inset: 0; }
    #text-edit {
      position: absolute;
      display: none;
      z-index: 20;
      margin: 0;
      padding: 4px 6px;
      border: 2px solid var(--accent);
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.97);
      color: #1a1a2e;
      font-family: inherit;
      line-height: 1.25;
      resize: none;
      overflow: hidden;
      outline: none;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    }
    body.presenting #text-edit { display: none !important; }
    /* shapes rendered from PPTX data: EMU-proportional boxes with the
       slide's own fills, strokes, and typography */
    .slide-shape {
      position: absolute;
      overflow: hidden;
      padding: 2px 4px;
      line-height: 1.2;
      white-space: pre-wrap;
      word-break: break-word;
      color: #1f2430;
      font-family: system-ui, sans-serif;
    }
    .slide-pic {
      position: absolute;
      background: rgba(122,162,247,0.10);
      border: 1px dashed rgba(122,162,247,0.40);
      overflow: hidden;
    }
    .slide-pic img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
    }
    .empty-state {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--dim);
      font-size: 14px;
      text-align: center;
    }
    /* ---------- notes editor ---------- */
    #notes-bar {
      border-top: 1px solid var(--border);
      background: var(--panel);
      padding: 14px 16px;
    }
    #notes-label {
      font-size: 11px;
      color: #c6cedd;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
      cursor: pointer;
      user-select: none;
    }
    #notes-bar.collapsed #notes-input { display: none; }
    #notes-bar.collapsed { padding-bottom: 10px; }
    #notes-input {
      width: 100%;
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 13px;
      font-family: inherit;
      resize: none;
      height: auto;
      min-height: 64px;
      max-height: 120px;
      overflow-y: auto;
      outline: none;
    }
    #notes-input:focus { border-color: var(--accent); }
    /* ---------- status bar ---------- */
    #status {
      border-top: 1px solid var(--border);
      background: var(--panel);
      padding: 9px 16px;
      font-size: 12px;
      color: #d0d8e6;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    #status-slide { font-weight: 600; color: #fff; letter-spacing: 0.5px; }
    #zoom-fit, #zoom-100 { padding: 2px 10px; font-size: 11px; font-weight: 600; color: #d0d8e6; letter-spacing: 0.2px; }
    #zoom-range {
      width: 120px;
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      background: #3a4460;
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }
    #zoom-range::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid #0f1117;
      box-shadow: 0 0 0 1px var(--accent);
    }
    #zoom-pct { font-size: 11.5px; color: #e2e8f2; min-width: 40px; text-align: center; font-variant-numeric: tabular-nums; }
    /* ---------- inspector ---------- */
    #inspector {
      width: 280px;
      min-width: 280px;
      background: var(--panel);
      border-left: 1px solid var(--border);
      padding: 14px;
      display: flex;
      flex-direction: column;
      font-size: 12px;
      overflow-y: auto;
    }
    #inspector h3 {
      margin: 0 0 6px;
      font-size: 11.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: #d0d8e6;
    }
    #inspector .row { font-size: 12.5px; }
    #inspector .row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      padding: 9px 0;
      border-bottom: 1px solid var(--border);
    }
    .add-slide {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 8px;
      font-size: 12.5px;
      font-weight: 600;
      border: 1px dashed #3a445c;
      background: transparent;
      border-radius: 8px;
      color: #c6cedd;
      flex-shrink: 0;
    }
    .add-slide:hover { border-color: var(--accent); color: #fff; background: rgba(122,162,247,0.08); }
    #inspector .row:last-child { border-bottom: none; }
    #inspector .row span { width: 52px; flex-shrink: 0; color: #c2cadb; font-size: 12.5px; }
    #inspector .sec { margin-top: 14px; }
    #inspector .row b {
      min-width: 0;
      font-weight: 600;
      color: #d6dcec;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.35;
    }
    #inspector .row b.wrap { white-space: normal; display: block; text-overflow: clip; }
    /* ---------- present mode ---------- */
    body.presenting #sidebar,
    body.presenting #inspector,
    body.presenting #notes-bar,
    body.presenting #status { display: none; }
    body.presenting #topbar { opacity: 0; pointer-events: none; }
    body.presenting.chrome-visible #topbar { opacity: 1; pointer-events: auto; }
    body.presenting #preview-wrap { padding: 0; }
    body.presenting #slide-canvas { border: none; border-radius: 0; box-shadow: none; }
    body.presenting #main { flex-direction: row; }
    body.presenting #console-side { display: flex; }
    /* ---------- slide grid navigator (G while presenting) ---------- */
    #slide-grid {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      flex-direction: column;
      background: rgba(13, 15, 21, 0.97);
      padding: 16px 22px 20px;
    }
    body.presenting.grid-open #slide-grid { display: flex; }
    #grid-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 14px;
      flex-shrink: 0;
    }
    #grid-title {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #d0d8e6;
    }
    #grid-hint { font-size: 12px; color: #9aa3b8; }
    #grid-cells {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 14px;
      overflow-y: auto;
      align-content: start;
      padding: 2px;
    }
    .grid-cell {
      position: relative;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 8px 7px;
      cursor: pointer;
      transition: border-color 0.12s, transform 0.12s, box-shadow 0.12s;
    }
    .grid-cell:hover { border-color: #3a445c; transform: translateY(-2px); }
    .grid-cell.current {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent), 0 6px 18px rgba(122, 162, 247, 0.18);
    }
    .grid-thumb {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #fff;
      border-radius: 5px;
      overflow: hidden;
    }
    .grid-num {
      position: absolute;
      top: 12px;
      left: 12px;
      min-width: 20px;
      height: 20px;
      padding: 0 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      background: rgba(15, 17, 23, 0.78);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
    }
    .grid-cell.current .grid-num { background: var(--accent); color: #0f1117; }
    .grid-label {
      margin-top: 6px;
      font-size: 12px;
      color: #9aa3b8;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #status .ok { color: var(--green); }
    #status .err { color: var(--danger); }
    .vdiv { width: 1px; height: 14px; background: var(--border); flex-shrink: 0; }
    .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
    .seg button { border: none; border-radius: 0; background: transparent; color: #b8c1d4; padding: 2px 10px; font-size: 11.5px; font-weight: 600; }
    .seg button + button { border-left: 1px solid var(--border); }
    .seg button:hover { color: #fff; background: #232a3c; }
    .seg button.on { background: var(--accent); color: #0f1117; }
    .seg button.on:hover { background: #8fb0ff; color: #0f1117; }
    .notes-count { margin-left: auto; color: #8f99b0; font-weight: 400; text-transform: none; letter-spacing: 0; font-size: 11px; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  </style>
</head>
<body>
  <header id="topbar">
    <h2 class="brand">Omashow</h2>
    <span id="doc-title"></span>
    <span id="doc-state"></span>
    <div class="toolbar">
      <button id="btn-new" title="New deck"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h9l5 5v15H6z"/><path d="M15 2v5h5"/></svg>New</button>
      <button id="btn-open" title="Open deck"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h6l2 2h10v12H3z"/></svg>Open</button>
      <button id="btn-save" title="Save deck"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h14v18H5z"/><path d="M8 3v6h8V3"/><path d="M8 14h8v7H8z"/></svg>Save</button>
      <button id="btn-saveas" title="Save deck as…"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h14v18H5z"/><path d="M8 3v6h8V3"/><path d="M8 14h8v7H8z"/></svg>Save As</button>
      <button id="btn-exportpdf" title="Export as vector PDF"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h9l5 5v15H6z"/><path d="M15 2v5h5"/><path d="M12 11v6"/><path d="M9.5 14.5 12 17l2.5-2.5"/></svg>Export PDF</button>
      <button id="btn-exporthtml" title="Export as a standalone HTML5 file (offline, any browser)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m8 8-5 4 5 4"/><path d="m16 8 5 4-5 4"/><path d="m13 5-2 14"/></svg>Export HTML</button>
      <span class="divider"></span>
      <button id="btn-add" title="Add a slide after the current one"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 8v8M8 12h8"/></svg>Add Slide</button>
      <span class="divider"></span>
      <button id="btn-undo" class="icon-btn" title="Undo (Ctrl+Z)" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
      <button id="btn-redo" class="icon-btn" title="Redo (Ctrl+Shift+Z)" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
    </div>
    <button id="btn-present" class="primary" title="Start the show — arrows to navigate, Esc to exit"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M7 4.5v15l13-7.5z"/></svg>Present</button>
  </header>
  <div id="content">
  <div id="sidebar">
    <div id="slides"></div>
  </div>

  <div id="main">
    <div id="preview-wrap">
      <div id="slide-canvas">
        <div id="slide-stage"></div>
        <svg id="ink-overlay" viewBox="0 0 12192000 6858000" preserveAspectRatio="none" aria-hidden="true"><g id="ink-strokes"></g></svg>
        <textarea id="text-edit" spellcheck="false"></textarea>
        <div id="empty-msg" class="empty-state">
          Open a .pptx or create a new deck to begin
        </div>
      </div>
    </div>
    <div id="notes-bar" style="display:none">
      <label id="notes-label" title="Show / hide notes">Speaker notes <span id="notes-count" class="notes-count"></span></label>
      <textarea id="notes-input" placeholder="Notes for this slide…"></textarea>
    </div>
    <div id="status">
      <span id="status-path">no file</span>
      <span class="vdiv"></span>
      <span id="status-slide"></span>
      <span class="vdiv"></span>
      <span class="seg">
        <button id="zoom-fit" class="on" title="Fit slide to window">Fit</button>
        <button id="zoom-100" title="Actual size">Actual</button>
      </span>
      <input id="zoom-range" type="range" min="25" max="200" step="25" value="100" title="Zoom level" />
      <span id="zoom-pct">–</span>
      <span class="vdiv"></span>
      <span id="status-msg"></span>
    </div>
    <aside id="console-side">
      <section class="console-block">
        <h3>Up next</h3>
        <div id="next-thumb"></div>
        <div id="next-label">—</div>
      </section>
      <section class="console-block notes-block">
        <h3>Speaker notes</h3>
        <div id="console-notes"></div>
      </section>
      <footer id="console-tools">
        <button id="btn-grid" class="icon-btn" title="Slide grid — jump to any slide (G)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg></button>
        <button id="btn-laser" class="icon-btn" title="Laser pointer — hold Ctrl, or toggle here (on while presenting)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="15" r="3" fill="currentColor" stroke="none"/><path d="M11.5 12.5 20 4"/><path d="M17 4h3v3"/></svg></button>
        <button id="btn-pen" class="icon-btn" title="Pen — draw on the slide (D)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg></button>
        <button id="btn-marker" class="icon-btn" title="Highlighter — draw on the slide (M)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 11-6 6v3h9l3-3"/><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4l8 8z"/></svg></button>
        <button id="btn-ink-undo" class="icon-btn" title="Undo last stroke (U)" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
        <button id="btn-ink-clear" class="icon-btn" title="Clear all strokes on this slide (C)" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg></button>
      </footer>
      <footer id="console-timer">
        <span id="timer-elapsed">00:00</span>
        <span id="timer-clock">--:--</span>
        <button id="btn-end-show" title="End presentation (Esc)">End Show</button>
      </footer>
    </aside>
    <div id="slide-grid" aria-hidden="true">
      <header id="grid-header">
        <span id="grid-title">Jump to slide</span>
        <span id="grid-hint">click a slide to jump · G or Esc to close</span>
      </header>
      <div id="grid-cells"></div>
    </div>
  </div>

  <aside id="inspector">
    <h3>Slide</h3>
    <div class="row"><span>Size</span><b id="insp-size">–</b></div>
    <div class="row"><span>Position</span><b id="insp-pos">–</b></div>
    <h3 class="sec">Content</h3>
    <div class="row"><span>Shapes</span><b id="insp-shapes">–</b></div>
    <div class="row"><span>Title</span><b id="insp-title">–</b></div>
  </aside>
  </div>
  <script src="slide_render.js"></script>
  <script src="main.js"></script>
</body>
</html>
